# =============================================================================
# CONFIGURACIÓN SONARQUBE - PROYECTO PYTHON FLASK
# =============================================================================
# Principios aplicados: POO, DRY, KISS, Single Responsibility
# =============================================================================

# -----------------------------------------------------------------------------
# PARÁMETROS OBLIGATORIOS DE IDENTIFICACIÓN DEL PROYECTO
# -----------------------------------------------------------------------------
sonar.projectKey=insumo_actividad_open_class_8
sonar.projectName=Insumo Actividad Open Class 8 - Gestión de Personas
sonar.projectVersion=1.0.0

# -----------------------------------------------------------------------------
# CONEXIÓN CON EL SERVIDOR SONARQUBE
# -----------------------------------------------------------------------------
sonar.host.url=http://localhost:9000
# IMPORTANTE: Reemplazar con tu token real de SonarQube
sonar.token=sqp_eafd0f50f6dda9101713a2c3bcf6afcfb19e93a1



# -----------------------------------------------------------------------------
# CONFIGURACIÓN DE FUENTES Y TESTS
# -----------------------------------------------------------------------------
# Código fuente principal (aplicación Flask)
sonar.sources=.

# Directorio de tests
sonar.tests=tests

# -----------------------------------------------------------------------------
# CONFIGURACIÓN DE CODIFICACIÓN Y EXCLUSIONES
# -----------------------------------------------------------------------------
sonar.sourceEncoding=UTF-8

# Excluir archivos y directorios no relevantes para análisis
sonar.exclusions=\
    **/__pycache__/**,\
    **/*.pyc,\
    **/*.pyo,\
    **/*.pyd,\
    **/.git/**,\
    **/venv/**,\
    **/env/**,\
    **/.env/**,\
    **/node_modules/**,\
    **/static/js/*.map,\
    **/static/css/*.map,\
    **/reporte/**,\
    **/registro_pruebas.txt,\
    **/ejecutar_pruebas.py

# Excluir archivos de test del análisis principal
sonar.test.exclusions=\
    **/tests/**,\
    **/test_*.py,\
    **/conftest.py

# -----------------------------------------------------------------------------
# CONFIGURACIÓN ESPECÍFICA PARA PYTHON
# -----------------------------------------------------------------------------
# Versión de Python (ajustar según tu entorno)
sonar.python.version=3.8,3.9,3.10,3.11,3.12

# Configuración de cobertura de código
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

# Configuración de duplicación de código
sonar.cpd.python.minimumLines=5
sonar.cpd.python.minimumTokens=70

# -----------------------------------------------------------------------------
# CONFIGURACIÓN DE CALIDAD Y REGLAS
# -----------------------------------------------------------------------------
# Umbrales de calidad
sonar.qualitygate.wait=true

# Configuración de complejidad ciclomática
sonar.python.complexity.function.threshold=10
sonar.python.complexity.class.threshold=20

# Configuración de líneas de código
sonar.python.lines.threshold=1000

# -----------------------------------------------------------------------------
# CONFIGURACIÓN DE ANÁLISIS DE SEGURIDAD
# -----------------------------------------------------------------------------
# Habilitar análisis de seguridad
sonar.security.sources.python=1

# Configuración de vulnerabilidades conocidas
sonar.security.vulnerabilities.python=1

# -----------------------------------------------------------------------------
# CONFIGURACIÓN DE MANTENIBILIDAD
# -----------------------------------------------------------------------------
# Análisis de deuda técnica
sonar.technicalDebt.rating=1

# Configuración de smells de código
sonar.codeSmells.enabled=true

# -----------------------------------------------------------------------------
# CONFIGURACIÓN DE DOCUMENTACIÓN
# -----------------------------------------------------------------------------
# Incluir archivos de documentación
sonar.includeDocHeaderComment=true

# Configuración de comentarios
sonar.comments.regularExpression=#.*$

# -----------------------------------------------------------------------------
# CONFIGURACIÓN DE REPORTES
# -----------------------------------------------------------------------------
# Generar reportes detallados
sonar.verbose=true

# Configuración de logs
sonar.log.level=INFO

# -----------------------------------------------------------------------------
# CONFIGURACIÓN DE INTEGRACIÓN CONTINUA
# -----------------------------------------------------------------------------
# Configuración para CI/CD
sonar.working.directory=.sonar

# Configuración de análisis incremental
sonar.analysis.mode=incremental

# -----------------------------------------------------------------------------
# NOTAS IMPORTANTES
# -----------------------------------------------------------------------------
# 1. Reemplazar TU_TOKEN_DE_SONAR_AQUI con tu token real de SonarQube
# 2. Ajustar sonar.python.version según las versiones que uses
# 3. Configurar rutas de cobertura si usas pytest-cov
# 4. Ajustar exclusiones según necesidades específicas del proyecto
# ============================================================================= 